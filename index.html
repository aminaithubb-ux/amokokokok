<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Черная машинка ночью на CSS</title>
<style>
    /* --- 1. ОКРУЖАЮЩАЯ СРЕДА (Ночное небо, Луна, Звезды, Трава) --- */
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        /* Ночное небо (темно-синий градиент) и Трава (темно-зеленый) */
        background: linear-gradient(to bottom, #0b132b 0%, #1c2541 60%, #1a3a1e 60%, #0f2312 100%);
        position: relative;
        display: flex;
        align-items: flex-end; /* Прижимаем дорогу к низу */
    }

    /* Луна (рисуем через фон body) */
    body::before {
        content: '';
        position: absolute;
        top: 40px;
        right: 80px;
        width: 70px;
        height: 70px;
        background-color: #f4f1de; /* Светло-желтоватый цвет */
        border-radius: 50%;
        box-shadow: 
            0 0 30px 10px rgba(244, 241, 222, 0.4), /* Свечение луны */
            -20px 0 0 0 #0b132b; /* Создаем "месяц" с помощью тени цвета неба */
    }

    /* Звезды (рисуем через фон body) */
    body::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 60%; /* Звезды только на небе */
        /* Множество маленьких белых точек с помощью радиальных градиентов */
        background-image: 
            radial-gradient(circle, #fff 1px, transparent 1px),
            radial-gradient(circle, #fff 1px, transparent 1px),
            radial-gradient(circle, #fff 1.5px, transparent 1.5px);
        background-size: 150px 150px, 200px 200px, 250px 250px;
        background-position: 10px 20px, 50px 80px, 120px 40px;
        opacity: 0.6;
        z-index: 1;
    }

    /* --- 2. ДОРОГА И ДЕРЕВЬЯ --- */
    .road {
        width: 100%;
        height: 120px;
        background-color: #1a1a1a; /* Темный асфальт */
        position: relative;
        border-top: 6px solid #333;
        border-bottom: 6px solid #333;
        z-index: 2; /* Дорога поверх деревьев и звезд */
    }

    /* Разметка на дороге (менее яркая для ночи) */
    .road::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 6px;
        transform: translateY(-50%);
        background: repeating-linear-gradient(to right, #666 0, #666 40px, transparent 40px, transparent 80px);
    }

    /* Деревья вдоль дороги (темные силуэты) */
    .road::after {
        content: '';
        position: absolute;
        bottom: 100%; /* Ставим над дорогой */
        left: 0;
        width: 100%;
        height: 100px;
        /* Темные силуэты деревьев */
        background-image: 
            radial-gradient(circle at 50% 100%, #081a0e 25px, transparent 26px), /* Крона */
            radial-gradient(circle at 50% 100%, #2e1d12 5px, transparent 6px);  /* Ствол */
        background-size: 150px 100px;
        background-repeat: repeat-x;
        background-position: 0 bottom;
        z-index: -1;
    }

    /* --- 3. МАШИНА --- */
    .car {
        width: 200px;
        height: 65px;
        background-color: #111; /* Черный цвет машины */
        position: absolute;
        bottom: 30px; /* Над дорогой */
        border-radius: 20px 50px 10px 10px;
        /* Анимация: 4 секунды, плавное торможение, остается в конце */
        animation: drive 4s ease-out forwards;
        /* Добавим легкую подсветку снизу и блики */
        box-shadow: inset 0 -10px 0 rgba(0,0,0,0.5), 0 0 15px rgba(255, 255, 255, 0.1);
        z-index: 10;
    }

    /* Кабина (Крыша) и Окна */
    .car::before {
        content: '';
        position: absolute;
        width: 110px;
        height: 45px;
        background-color: #111;
        top: -32px;
        left: 40px;
        border-radius: 40px 40px 0 0;
        /* Темные окна с небольшим отражением */
        background-image: 
            linear-gradient(to right, transparent 45px, #111 45px, #111 48px, transparent 48px),
            linear-gradient(to bottom, #2a2a2a, #0d0d0d);
        background-size: 100% 100%;
        border: 5px solid #111;
        box-sizing: border-box;
    }

    /* Колеса */
    .car::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 25px;
        width: 40px;
        height: 40px;
        background-color: #000;
        border-radius: 50%;
        border: 6px solid #555; /* Темные диски */
        /* Второе колесо */
        box-shadow: 120px 0 0 -6px #000, 120px 0 0 0 #555;
    }

    /* Фары (добавим маленькие огоньки для ночи) */
    .car .headlight {
        position: absolute;
        right: 0;
        top: 20px;
        width: 10px;
        height: 15px;
        background-color: #fff;
        border-radius: 0 50% 50% 0;
        box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.7);
    }

    /* Ключевые кадры для выезда машины */
    @keyframes drive {
        0% {
            left: -200px;
        }
        100% {
            left: calc(100% - 250px);
        }
    }
</style>
</head>
<body>

    <!-- Минимальное количество HTML -->
    <div class="road">
        <div class="car">
            <!-- Добавляем элемент для фары -->
            <div class="headlight"></div>
        </div>
    </div>

</body>
</html>
